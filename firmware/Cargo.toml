[package]
name = "ese-2026-firmware"
version = "0.1.0"
edition = "2024"

[dependencies]
# Crates from the embassy framework. IMPORTANT: These are "patched" to a recent git commit
# down in the `patch.crates-io` section
embassy-rp = { version = "0.10.0", features = ["rp235xb", "defmt", "unstable-pac", "time-driver", "critical-section-impl", "binary-info", "executor-thread", "executor-interrupt"] }
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }

# Logging framework
defmt = "1.2.0"
defmt-rtt = "1.3.1"

# Panic handler that works well with probe-rs
panic-probe = "1.0.0"

# Platform support for cortex-m
cortex-m = "0.7.10"
cortex-m-rt = "0.7.7"
critical-section = "1.2.0"

# Async version of Embedded HAL: a powerful abstraction that allows reusing drivers across chips and platforms
embedded-hal-async = "1.0.0"

# Driver for SSD1306 I2C display
ssd1306 = { version = "0.10.0", features = ["async"] }
# Embedded no_std graphics framework
embedded-graphics = { version = "0.8.2", features = ["defmt"] }

# Overwriting the published crate versions from crates.io with a specific commit from the git repo
# Background: embassy has some huge crates because it builds hardware abstraction layers (HALs) for
# hundreds of different microcontrollers. Generating the documentation alone generates big load on
# crates.io, so new versions are released seldomly.
#
# The latest documentation can therefore be found at https://docs.embassy.dev/embassy-rp/0.10.0/rp235xb/index.html
[patch.crates-io]
embassy-rp = { git = "https://github.com/embassy-rs/embassy.git", rev = "2b69fd062148e2b1ec678b04b01499c1af5fd39e"}
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", rev = "2b69fd062148e2b1ec678b04b01499c1af5fd39e"}
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", rev = "2b69fd062148e2b1ec678b04b01499c1af5fd39e"}
